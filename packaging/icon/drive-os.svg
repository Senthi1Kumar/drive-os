<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#80a7ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#80a7ff" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#80a7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#80a7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <!-- steering rim -->
  <path d="M 100 330 A 156 156 0 1 1 412 330" fill="none" stroke="#80a7ff" stroke-width="46" stroke-linecap="round"/>
  <!-- road receding to the horizon -->
  <path d="M 190 444 L 240 336 L 272 336 L 322 444 Z" fill="url(#road)"/>
  <path d="M 256 432 L 256 404 M 256 386 L 256 360" stroke="#050608" stroke-width="10" stroke-linecap="round"/>
  <!-- live voice pulse -->
  <circle cx="256" cy="252" r="52" fill="none" stroke="#66edc5" stroke-opacity="0.35" stroke-width="10"/>
  <circle cx="256" cy="252" r="30" fill="#66edc5"/>
</svg>
