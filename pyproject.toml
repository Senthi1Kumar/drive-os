[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "driveos"
version = "1.1.0"
description = "DriveOS — hands-free, voice-first in-vehicle ordering and payments (Nova assistant)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Elevatics AI" }
authors = [{ name = "Elevatics AI" }]
dependencies = [
  "PySide6>=6.7",
  "qasync>=0.27",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rapidfuzz>=3.9",
  "cryptography>=42",
  "mcp>=2.3,<3",
  "websockets>=13",
  "pillow>=10",
]

[project.optional-dependencies]
voice = [
  "sounddevice>=0.4.7",
  "numpy>=1.26",
  "webrtcvad-wheels>=2.0.14",
  "faster-whisper>=1.0.3",
  # openWakeWord's runtime deps; the package itself is installed with --no-deps by scripts/setup.*
  # because its Linux pin on tflite-runtime has no wheels for Python 3.12+ (we use its ONNX backend)
  "onnxruntime>=1.17",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "tqdm>=4.0",
  "requests>=2.0",
  "kokoro-onnx>=0.4.0",
  "pyttsx3>=2.90",
  "ptts==0.5.0",
]
# voice-first payment verification. DriveAuth is not on PyPI: install the pinned checkout
# (Drive_auth_edge 76f33c8) with `pip install -e /path/to/Drive_auth_edge`
biometrics = [
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "huggingface-hub>=0.24",
  "pyarrow>=15",        # only to build the calibration cohort
  "soundfile>=0.12",
]
gps = [
  "pyserial>=3.5",   # NMEA from USB/UART receivers (serial:/dev/ttyACM0); tty fallback works without it
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
driveos = "driveos.cli:main"
driveos-merchant-mcp = "driveos.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/driveos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["ui: renders QML offscreen (slower)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# verify(timeout) is the sensor contract; screens.py runs once per QA capture
ignore = ["E501", "ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E702", "E731", "B905"]
