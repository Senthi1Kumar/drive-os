name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"      # tests never download models; the ones that need models or hardware skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 \
            libnss3 libasound2 libportaudio2 libsndfile1 espeak-ng
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[voice,biometrics,gps,dev]"
          pip install packaging/vendor/driveauth_edge-1.0.0-py3-none-any.whl
      - run: ruff check src tests
      - run: node --check src/driveos/ui/web/map.js
      - run: pytest -q

  hmi:
    name: HMI build and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git libsdl2-dev libdrm-dev libjpeg-dev
      - name: Configure
        run: cmake -S hmi_lvgl -B hmi_lvgl/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build hmi_lvgl/build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir hmi_lvgl/build --output-on-failure
